# koneps_ai_project 프로덕션 스택
# 사용:  docker compose up -d --build
# DB는 외부 Supabase(트랜잭션 풀러) 사용 — postgres 컨테이너 없음.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 가 .env에 설정되어야 합니다}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 가 .env에 설정되어야 합니다}
      G2B_API_KEY: ${G2B_API_KEY:?G2B_API_KEY 가 .env에 설정되어야 합니다}
      # 수집기(collector/naramarket.py)는 NARA_API_KEY를 읽음 — 값은 G2B와 동일
      NARA_API_KEY: ${NARA_API_KEY:-${G2B_API_KEY}}
      LIBREAI_API_KEY: ${LIBREAI_API_KEY:?LIBREAI_API_KEY 가 .env에 설정되어야 합니다}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY 가 .env에 설정되어야 합니다}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro-preview}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-pro}
      LIBREAI_API_URL: ${LIBREAI_API_URL:-https://convert.liberoai.net/api}
      # CORS: 실제 접속 origin만 허용. 서버 IP/도메인 바뀌면 .env에서 수정.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://113.198.65.38:8080"]}
      SQL_ECHO: ${SQL_ECHO:-false}
      TZ: Asia/Seoul
    volumes:
      # 사용자 업로드 파일 + G2B 다운로드 캐시 (호스트 보존)
      - ./downloads:/app/downloads
      # 학습 샘플 (수정 시 즉시 반영)
      - ./samples:/app/samples:ro
    # 외부엔 노출 안 함 (nginx web 컨테이너만 통해 접근)

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 같은 호스트의 nginx가 /api → backend:8000 으로 프록시.
        # 서버 IP나 도메인이 바뀌어도 프런트 재빌드 불필요.
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

  # Cloudflare Quick Tunnel — 외부 방화벽 우회용 임시 HTTPS URL 발급.
  # 컨테이너 재시작마다 새 URL이 발급됨 (trycloudflare.com 서브도메인).
  # 안정적인 URL이 필요하면 도메인 추가 + Named Tunnel로 전환.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # 방화벽이 QUIC(UDP 7844)을 막는 경우가 많아 HTTP/2(TCP)로 강제 전환
    command: tunnel --no-autoupdate --protocol http2 --url http://web:80
    depends_on:
      - web
